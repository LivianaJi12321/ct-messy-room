<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Until we clean — a study in accumulation</title>
<style>
:root{color-scheme:light;--paper:#e5f2e9;--ink:#684937;--accent:#684937}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}main{max-width:1120px;margin:auto;padding:48px 32px}header{display:flex;justify-content:space-between;align-items:start;gap:24px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase}h1{font:normal clamp(38px,6vw,70px)/1.05 Georgia,serif;margin:20px 0 16px}p{line-height:1.6}.intro{max-width:540px;color:#795d4b}.number{font:normal 64px Georgia,serif}.counter{text-align:right;white-space:nowrap;padding-top:35px}.counter small{font-size:22px;color:#866c59}.counter-label{font-size:11px;text-transform:uppercase;letter-spacing:1px}.stage{height:350px;display:grid;place-items:center;position:relative;border-top:1px solid #68493730;border-bottom:1px solid #68493730;margin-top:32px;overflow:hidden;background:transparent}svg{width:100%;height:100%;overflow:visible}path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;vector-effect:non-scaling-stroke}.stage-note{position:absolute;bottom:12px;left:0;font-size:10px;letter-spacing:2px;color:#866c59}.controls{display:flex;align-items:center;justify-content:space-between;gap:30px;padding:28px 0}button{font:inherit;border:1px solid var(--ink);border-radius:3px;padding:15px 22px;cursor:pointer}#add{background:transparent;color:var(--ink)}#reset,#play{background:transparent}#reset{margin-left:8px}.controls>div:first-child{display:flex;gap:8px;flex-wrap:wrap}#reset{margin-left:0}button:disabled{opacity:.45;cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.slider{width:240px;font-size:13px}.slider label{display:flex;justify-content:space-between}input{width:100%;accent-color:var(--accent);margin:14px 0 3px}.hint{font-size:11px;color:#866c59}.status{min-height:26px;font-size:14px;color:var(--accent)}.stats{display:flex;gap:35px;font-size:12px;margin:18px 0 35px}.stats strong{font-size:20px;font-weight:normal;margin-right:7px}details{border-top:1px solid #68493730;padding-top:20px;font-size:13px;max-width:740px}summary{cursor:pointer}details p{color:#795d4b}footer{margin-top:35px;font-size:10px;letter-spacing:1px;color:#866c59}@media(max-width:650px){main{padding:28px 20px}header{display:block}.counter{text-align:left;padding-top:5px}.number{font-size:42px}.stage{height:290px;margin-top:20px}.controls{align-items:start;flex-direction:column}.slider{width:100%}button{padding:13px 15px}.stats{gap:18px;flex-wrap:wrap}}

#tonearm{transform-origin:430px 75px;transition:transform .65s ease-in-out} .cleaning #tonearm{transform:rotate(36deg)}
#record{transform-origin:250px 230px;animation:turn 36s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.stage{height:440px}svg{max-width:560px}
@media(max-width:650px){.stage{height:350px}}
@media(prefers-reduced-motion:reduce){#tonearm{transition:none}#record{animation:none}}

button{transition:background .18s ease}button:hover:not(:disabled){background:#6849370c}path{stroke-width:1.5}
input[type=range]{appearance:none;-webkit-appearance:none;background:transparent;height:18px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper);margin-top:-6px}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper)}

/* A handwritten face supplied by macOS; fallbacks keep the page self-contained. */
body,button,input{font-family:"Chalkboard SE","Comic Sans MS","Bradley Hand",cursive}
h1{font-family:"Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;font-weight:normal}
.number{font-family:"Chalkboard SE","Comic Sans MS",cursive}
.eyebrow,.counter-label,.stage-note,footer{letter-spacing:1px}
.stage{perspective:950px;overflow:hidden;height:480px}
.stage svg{transform:rotateX(29deg) rotateZ(-12deg);transform-origin:50% 52%;filter:drop-shadow(12px 22px 8px #68493718);height:94%;overflow:visible}
@media(max-width:650px){.stage{height:365px}.stage svg{width:90%;transform:rotateX(29deg) rotateZ(-12deg)}}

[hidden]{display:none!important}
#staff path{stroke-width:3.2;stroke:#684937}
#stringShadows{transform:translate(2px,4px);opacity:.23;filter:blur(.8px)}
#stringShadows path{stroke:#684937;stroke-width:4.5}
#stringHighlights{transform:translate(-.6px,-.8px);pointer-events:none}
#stringHighlights path{stroke:#cbb99d;stroke-width:1}
.progress-wrap{max-width:560px;margin:0 auto 20px;text-align:center}
.progress-label{font-size:14px;color:var(--ink)}
#buildup svg{display:block;width:100%;height:38px;margin-top:7px}
.status{text-align:center;color:var(--ink)}
.controls{justify-content:center}

#record{animation:none}
#staff path{stroke:var(--ink);stroke-width:1;opacity:.9}
#stringHighlights{display:none}
#stringShadows{transform:none;opacity:.09;filter:none}
#stringShadows path{stroke:var(--ink);stroke-width:.7}

main{max-width:760px;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:28px}
.stage{border:0;margin:0;height:min(65svh,530px);overflow:visible}
.controls{flex-direction:row;padding:65px 0 24px;position:relative;z-index:2}
#tonearm{cursor:grab;touch-action:none;pointer-events:all}
#tonearm:active{cursor:grabbing}
#tonearm:focus{outline:none}#tonearm:focus-visible{filter:drop-shadow(0 0 3px #68493770)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

.guide{display:block;text-align:center;margin:0 auto 8px}.guide h1{font-size:32px;margin:0 0 10px}.guide p{font-size:15px;line-height:1.6;margin:0;color:var(--ink)}
.progress-wrap{width:min(100%,400px);margin:0 auto 12px}.status{font-size:14px;min-height:44px;max-width:460px;margin:0 auto;text-align:center}
main{padding-top:36px;padding-bottom:30px}.stage{height:min(55svh,460px)}.controls{padding:48px 0 15px}
.stage svg{width:min(78%,430px);height:100%;flex-shrink:0}.controls{padding:65px 0 15px}

/* Reserve the entire transformed illustration footprint in normal flow. */
main{display:block;min-height:100svh}
.stage{display:block;position:relative;width:100%;height:auto;aspect-ratio:1 / 1.08;margin:18px auto 0;overflow:visible}
.stage svg{position:absolute;left:16%;top:10%;width:68%;height:78%;max-width:none;transform-origin:50% 50%;transform:rotateX(29deg) rotateZ(-12deg)}
.controls{position:relative;display:flex;justify-content:center;padding:12px 0 22px;margin:0}
@media(min-width:700px){.stage{max-width:620px}}
</style>
</head>
<body><main><header class="guide"><h1>Little things build up.</h1><p>Leave something out. Let it accumulate.<br>Move the tonearm when you’re ready to tidy up.</p></header><div class="stage"><svg viewBox="0 0 500 460" role="group" aria-label="A three-dimensional tilted record player with twelve slowly rotating fine lines lift and billow like fabric in the wind as buildup increases, then return to neat circles during cleaning"><path d="M20 40 L20 448 Q20 466 42 466 L458 466 Q480 466 480 448 L480 40" style="fill:var(--paper);stroke:var(--ink);stroke-width:1.5"/><path d="M20 430 L20 448 M480 430 L480 448" style="stroke:var(--ink);stroke-width:1.5"/><rect x="20" y="18" width="460" height="420" rx="22" fill="none" stroke="var(--ink)" stroke-width="1.5"/><circle cx="250" cy="230" r="201" fill="none" stroke="var(--ink)" stroke-width="1.5"/><g id="jolt"><g id="record"><g id="stringShadows"></g><g id="staff"></g><g id="stringHighlights"></g><circle cx="250" cy="230" r="3" fill="var(--ink)"/><circle cx="250" cy="194" r="2.5" fill="var(--accent)"/></g></g><g id="tonearm" role="button" tabindex="0" aria-label="Move tonearm onto record to untangle strings"><title>Drag onto the record, or click to clean</title><path d="M430 75 L447 195 L426 232" style="stroke:transparent;stroke-width:36;pointer-events:stroke"/><circle cx="430" cy="75" r="16" fill="var(--paper)" stroke="var(--ink)"/><path d="M430 75 L447 195 L426 232" style="stroke:var(--ink);stroke-width:8;stroke-linejoin:round"/><path d="M430 75 L447 195 L426 232" style="stroke:var(--paper);stroke-width:5"/><rect x="418" y="222" width="16" height="31" rx="3" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5" transform="rotate(28 426 237)"/><circle cx="430" cy="75" r="5" fill="var(--ink)"/></g></svg></div>
<div class="controls"><button id="add">Leave something out</button></div><div class="progress-wrap"><div id="buildup" role="img" aria-label="Accumulation: empty"><svg viewBox="0 0 500 32" aria-hidden="true"><defs><clipPath id="progressClip"><path d="M8 6 Q125 2 248 6 T491 5 L490 25 Q370 29 248 25 T8 26 Z"/></clipPath><pattern id="hatching" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><path d="M2 0 L2 7" style="stroke:var(--ink);stroke-width:3"/></pattern></defs><rect id="progressFill" x="5" y="2" width="0" height="28" fill="url(#hatching)" clip-path="url(#progressClip)"/><path d="M8 6 Q125 2 248 6 T491 5 L490 25 Q370 29 248 25 T8 26 Z"/></svg></div></div><div id="status" role="status" aria-live="polite" class="status">Everything is in its place—for now.</div></main>
<script>
const $=id=>document.getElementById(id);
const paths=Array.from({length:12},()=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');$('staff').appendChild(p);return p;});
const shadows=paths.map(()=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');$('stringShadows').appendChild(p);return p;});
const highlights=paths.map(()=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');$('stringHighlights').appendChild(p);return p;});
let points=0,threshold=100,actions=0,cycles=0,last='—',busy=false,visual=0,animation=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let currentJolt=0;
function draw(disorder,jolt=0){
 currentJolt=jolt;
 const time=reduced?0:performance.now()/1000,rotation=time*Math.PI/18;
 paths.forEach((path,i)=>{let d='',ground='';const radius=43+i*9,phase=i*.49;
 for(let j=0;j<=240;j++){const angle=j/240*Math.PI*2;
 // Shared traveling folds make an airy sheet; phase offsets weave adjacent threads.
 const fold=angle*2+phase-time*.65;
 const lift=disorder*(28+105*Math.pow(.5+.5*Math.sin(fold),2)+25*Math.sin(angle*3-phase+time*.8));
 const r=radius+disorder*(17*Math.sin(angle*3+phase-time*.35)+12*Math.sin(angle*2-phase));
 const theta=angle+rotation+disorder*.15*Math.sin(fold);
 const x=250+r*Math.cos(theta)+disorder*12*Math.sin(fold);
 const baseY=230+r*Math.sin(theta),y=baseY-lift;
 d+=(j?'L':'M')+x.toFixed(2)+','+y.toFixed(2);
 ground+=(j?'L':'M')+x.toFixed(2)+','+baseY.toFixed(2);}
 path.setAttribute('d',d+'Z');shadows[i].setAttribute('d',ground+'Z');});
 $('jolt').setAttribute('transform',`translate(${jolt*12} ${-jolt*7})`);
}
function render(){ $('progressFill').setAttribute('width',String(490*Math.min(points/100,1)));$('buildup').setAttribute('aria-label',points===0?'Accumulation: empty':points>=100?'Accumulation: full. Move the tonearm to tidy up.':'Accumulation is growing.'); $('add').disabled=busy;$('tonearm').setAttribute('aria-disabled',String(busy||points===0)); }
function tween(from,to,duration,done){cancelAnimationFrame(animation);const start=performance.now();function frame(now){const t=Math.min(1,(now-start)/duration);visual=from+(to-from)*(1-Math.pow(1-t,3));
 const jolt=reduced?0:Math.sin(t*Math.PI*5)*Math.pow(1-t,2)*2;
 draw(visual,jolt);if(t<1)animation=requestAnimationFrame(frame);else if(done)done();}animation=requestAnimationFrame(frame);}
function clean(){
 if(busy||points===0)return;
 busy=true;render();document.querySelector('.stage').classList.add('cleaning');
 $('status').textContent='Untangling the strings.';
 const start=performance.now(),from=visual,duration=reduced?120:3000;
 function frame(now){const t=Math.min(1,(now-start)/duration);visual=from*(1-t*t*(3-2*t));draw(visual);
 if(t<1)animation=requestAnimationFrame(frame);else{document.querySelector('.stage').classList.remove('cleaning');points=0;visual=0;busy=false;draw(0);render();$('status').textContent='Strings restored. Leave something out to begin again.';}}
 animation=requestAnimationFrame(frame);
}
$('add').addEventListener('click',()=>{if(busy)return;points+=Math.floor(Math.random()*11)+5;busy=true;render();$('status').textContent=points>=100?'It has piled up. Move the tonearm when you’re ready.':'A little left out. A little more tangled.';
 // A soft limit keeps every click meaningful without lifting lines off the stage.
 tween(visual,1-Math.exp(-points/75),reduced?30:650,()=>{busy=false;render();});});
const arm=$('tonearm');let drag=null,suppressClick=false;
arm.addEventListener('pointerdown',e=>{if(busy||points===0)return;drag={x:e.clientX,y:e.clientY,moved:false};arm.setPointerCapture(e.pointerId);});
arm.addEventListener('pointermove',e=>{if(!drag)return;const dx=drag.x-e.clientX;drag.moved=drag.moved||Math.hypot(dx,e.clientY-drag.y)>8;if(drag.moved){arm.style.transition='none';arm.style.transform=`rotate(${Math.max(0,Math.min(36,dx*.45))}deg)`;}});
function release(e){if(!drag)return;const inward=drag.x-e.clientX>22,moved=drag.moved;drag=null;arm.style.transition='';arm.style.transform='';suppressClick=moved;if(inward)clean();}
arm.addEventListener('pointerup',release);
arm.addEventListener('pointercancel',()=>{drag=null;arm.style.transition='';arm.style.transform='';});
arm.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return;}clean();});
arm.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();clean();}});
draw(0);render();
function windFrame(){draw(visual,currentJolt);requestAnimationFrame(windFrame);}
requestAnimationFrame(windFrame);
</script></body></html>
